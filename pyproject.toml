[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "unli-photos"
version = "0.1.0"
description = "Auto-sync media to Google Photos with Pixel unlimited spoofing via gotohp-cli. Textual TUI + headless service mode."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Kenneth" }]
keywords = ["google-photos", "backup", "tui", "textual", "gotohp"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Topic :: Multimedia :: Graphics",
  "Topic :: System :: Archiving :: Backup",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "textual>=1.0",
  "watchdog>=4.0",
  "httpx>=0.27",
]

[project.urls]
Repository = "https://github.com/kenneth/unli-photos"
Upstream = "https://github.com/xob0t/gotohp"

[project.scripts]
unli = "unli_photos.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/unli_photos"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::RuntimeWarning"]
